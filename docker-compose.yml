version: '3.9'

services:
  web:
    build: .
    command: gunicorn --bind 0.0.0.0:1630 run:app
    ports:
      - '1630:1630'
    environment:
      PORT: '1630'
      SECRET_KEY: 'change-me'
      STORAGE_ROOT: '/data/storage'
    volumes:
      - storage:/data/storage
    depends_on:
      - redis

  worker:
    build: .
    command: python -m app.workers.tasks
    environment:
      REDIS_URL: 'redis://redis:6379/0'
    volumes:
      - storage:/data/storage
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

volumes:
  storage:
